name: Reproducible checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix local --ignore-scripts --no-audit --no-fund
      - run: npm --prefix local test
      - run: node --experimental-sqlite --test ops/runpod-shutdown/*.test.mjs
      - run: npm --prefix dashboard run build
      - run: node --test dashboard/*.test.mjs
      - run: node experiments/verify-live-evidence.mjs
      - run: npm ci --prefix launch --ignore-scripts --no-audit --no-fund
      - run: npm --prefix launch test
