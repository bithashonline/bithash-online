name: Local checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: launch/package-lock.json
      - name: Test fixture solver, recovery, accounting and receipt observations
        working-directory: local
        run: npm test
      - name: Install pinned launch dependencies without lifecycle scripts
        working-directory: launch
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test unsigned launch builder
        working-directory: launch
        run: npm test
